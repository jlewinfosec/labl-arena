<style id="labl-theme">
/* ============ LABL · Louisiana Blaster League theme ============
   Navy field, orange play, white light. Built for a tablet in the sun: big type, hard contrast, no glow. */
:root{
  --navy:#0f1f5c; --navy2:#172b74; --navy3:#203880; --edge:#2a4190; --orange:#f07820; --orange2:#c85e0e; --gold:#ffd36a;
  --bg:var(--navy); --casing:var(--navy2); --casing2:#132565; --rust:var(--edge); --stain:rgba(240,120,32,.08);
  --ph:var(--orange); --ph2:#ff9a4a; --phd:#9a4d14; --phdd:#3a2410; --glass:#0b1740;
  --amber:var(--gold); --amberd:#8a6a1c; --red:#ff5a4e; --redd:#8a1f18; --blood:#5a1410;
  --bone:#f4f6fb; --bone-dim:#c0cbea; --glow:var(--orange); --ore:var(--gold); --blood2:var(--red); --clot:#1a0a2a;
  --glowc:240,120,32; --amberc:255,211,106; --redc:255,90,78; --screen1:#162a6e; --screen2:#0f1f5c; --screen3:#0a1540; --ink:#0b1538;
  --px:"Barlow","Helvetica Neue",Arial,sans-serif; --hd:"Oswald","Barlow Semi Condensed","Arial Narrow",sans-serif; --mono:"Barlow Semi Condensed","Barlow",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:var(--navy); } }
:root[data-theme="dark"]{ --bg:var(--navy); }
body.labl, body.labl.day, body.labl.night, body.labl.redlight{
  --navy:#0f1f5c; --navy2:#172b74; --navy3:#203880; --edge:#2a4190; --orange:#f07820; --orange2:#c85e0e; --gold:#ffd36a;
  --bg:var(--navy); --casing:var(--navy2); --casing2:#132565; --rust:var(--edge); --stain:rgba(240,120,32,.08);
  --ph:var(--orange); --ph2:#ff9a4a; --phd:#9a4d14; --phdd:#3a2410; --glass:#0b1740;
  --amber:var(--gold); --amberd:#8a6a1c; --red:#ff5a4e; --redd:#8a1f18; --blood:#5a1410;
  --bone:#f4f6fb; --bone-dim:#c0cbea; --glow:var(--orange); --ore:var(--gold); --blood2:var(--red); --clot:#1a0a2a;
  --glowc:240,120,32; --amberc:255,211,106; --redc:255,90,78; --screen1:#162a6e; --screen2:#0f1f5c; --screen3:#0a1540; --ink:#0b1538;
  --px:"Barlow","Helvetica Neue",Arial,sans-serif; --hd:"Oswald","Barlow Semi Condensed","Arial Narrow",sans-serif; --mono:"Barlow Semi Condensed","Barlow",Arial,sans-serif;
}
html{background:var(--navy)}
body,body.day,body.night{color:var(--bone); font-family:var(--px); font-size:calc(17px*var(--tx)); line-height:1.3; background:
  linear-gradient(180deg, rgba(255,255,255,.04), transparent 40%),
  repeating-linear-gradient(-32deg, rgba(255,255,255,.025) 0 2px, transparent 2px 18px),
  var(--navy) !important}
body.labl::after{content:""; position:fixed; right:-6vw; bottom:-8vw; width:52vw; height:52vw; max-width:560px; max-height:560px; pointer-events:none; z-index:0;
  background:url("LABL_LOGO_URL") center/contain no-repeat; opacity:.07; filter:grayscale(1) brightness(1.6)}
#app{position:relative; z-index:1}
/* night / redlight: never in LABL */
body.night{--bg:var(--navy)}

/* ---- type ---- */
body.labl h1, body.labl h2, body.labl h3{text-shadow:none; letter-spacing:.02em}
body.labl h1{font-family:var(--hd); font-weight:700; font-size:calc(34px*var(--tx)); color:#fff; line-height:1.02}
body.labl h2{font-family:var(--hd); font-weight:500; font-size:calc(24px*var(--tx)); color:#fff}
body.labl h3{font-family:var(--mono); font-weight:600; font-size:calc(14px*var(--tx)); color:var(--orange); letter-spacing:.08em}
body.labl .help, body.labl .flav, body.labl .sqlbl, body.labl .meta{font-family:var(--mono)}
body.labl .flav{border-left:3px solid var(--orange); color:var(--bone-dim)}
body.labl .msg{text-shadow:none; font-family:var(--mono); font-weight:600; font-size:calc(18px*var(--tx)); color:var(--gold)}
body.labl .msg.bad{text-shadow:none; color:var(--red)}
body.labl p, body.labl li, body.labl label, body.labl td, body.labl th{font-family:var(--px)}

/* ---- panels: flat navy, white edge, no screws ---- */
body.labl .plate{background:linear-gradient(180deg, var(--navy2), #142667); border:1px solid rgba(255,255,255,.14); border-radius:10px; box-shadow:0 6px 18px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.08); padding:16px 18px 14px}
body.labl .plate::before, body.labl .plate::after, body.labl .plate .rv{display:none}
body.labl .fold{background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.12); border-radius:8px}
body.labl .fold>summary{font-family:var(--hd); font-weight:500; text-transform:uppercase; letter-spacing:.04em; color:#fff}

/* ---- buttons: solid, square-ish, readable outdoors ---- */
body.labl .btn{font-family:var(--hd); font-weight:500; text-transform:uppercase; letter-spacing:.04em; font-size:calc(19px*var(--tx));
  background:rgba(255,255,255,.06); border:2px solid rgba(255,255,255,.28); color:#fff; border-radius:8px; text-shadow:none; box-shadow:0 2px 0 rgba(0,0,0,.35); min-height:50px}
body.labl .btn:active{background:#fff; color:var(--navy); transform:translateY(1px)}
body.labl .btn.go{background:var(--orange); border-color:var(--orange); color:#fff; text-shadow:none; box-shadow:0 3px 0 var(--orange2)}
body.labl .btn.go:active{background:var(--orange2); color:#fff}
body.labl .btn.small{font-size:calc(15px*var(--tx)); min-height:48px; padding:4px 10px; border-width:1.5px}
body.labl .btn.on, body.labl .btn.small.on{background:#fff; color:var(--navy); border-color:#fff}
body.labl .btn.untr{border-style:solid; border-color:var(--gold); color:var(--gold); background:rgba(255,211,106,.08)}
body.labl .btn.untr::before{content:""}
body.labl .btn.danger, body.labl .btn.bad{border-color:var(--red); color:var(--red)}
body.labl .btn.danger.on{background:var(--red); color:#fff}
body.labl .btn.modepick{background:var(--orange); color:#fff; border-color:var(--orange)}
body.labl .btn:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
body.labl .pinbox, body.labl input.pinbox{background:#0b1740 !important; color:#fff !important; border:2px solid rgba(255,255,255,.3) !important; border-radius:8px !important; font-family:var(--hd) !important}
body.labl input[type=text], body.labl input[type=number], body.labl input[type=time], body.labl select, body.labl textarea{font-family:var(--px); color:#fff; background:#0b1740; border:1.5px solid rgba(255,255,255,.3); border-radius:8px; padding:8px 10px}
body.labl select option{color:#000}

/* ---- HUD / clock: the loud thing ---- */
body.labl .hud .t{font-family:var(--hd); font-weight:700; color:var(--gold); text-shadow:none}
body.labl .hud .t.hot{color:var(--red); text-shadow:none}
body.labl [data-bbnow]{font-family:var(--hd) !important; font-weight:500}

/* ---- tiles (mission tablet, mini-game menu) ---- */
body.labl .game .ico{background:var(--navy3); color:#fff; border:1px solid rgba(255,255,255,.18); border-radius:10px}
body.labl .labl-tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:0 12px}
.labl-tiles .plate{margin:8px 0}

/* ---- LABL shell ---- */
body.labl .labl-bar{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; padding:6px 0 8px; border-bottom:3px solid var(--orange); margin-bottom:8px}
body.labl .labl-brand{display:flex; align-items:center; gap:12px}
body.labl .labl-kicker{font-family:var(--mono); font-weight:600; font-size:calc(12px*var(--tx)); letter-spacing:.14em; color:var(--orange)}
body.labl .labl-title{font-family:var(--hd); font-weight:700; font-size:calc(26px*var(--tx)); color:#fff; line-height:1; text-transform:uppercase}
body.labl .labl-logo{width:160px; height:160px; object-fit:contain; filter:drop-shadow(0 0 18px rgba(240,120,32,.55))}
body.labl .labl-logo-compact{width:44px; height:44px; filter:drop-shadow(0 0 6px rgba(240,120,32,.5))}
body.labl .labl-splash{position:relative; text-align:center; padding:26px 0 10px; overflow:hidden}
body.labl .labl-splash .labl-logo{width:min(44vw,220px); height:min(44vw,220px); animation:lablIn .9s cubic-bezier(.2,.8,.2,1) both}
body.labl .labl-splash::before{content:""; position:absolute; left:-40%; top:0; width:40%; height:100%; background:linear-gradient(100deg, transparent, rgba(255,255,255,.35), transparent); transform:skewX(-14deg); animation:lablShine 2.4s .6s ease-in-out 1; pointer-events:none}
body.labl .labl-h1{font-family:var(--hd); font-weight:700; font-size:calc(48px*var(--tx)); color:#fff; letter-spacing:.04em; margin-top:6px; line-height:1}
body.labl .labl-h1::after{content:""; display:block; width:84px; height:5px; background:var(--orange); margin:8px auto 6px; border-radius:3px}
@keyframes lablIn{from{opacity:0; transform:scale(.6) rotate(-18deg)} to{opacity:1; transform:none}}
@keyframes lablShine{from{left:-40%} to{left:120%}}
@media (prefers-reduced-motion: reduce){ .labl-splash .labl-logo,.labl-splash::before{animation:none} }
body.labl .labl-tabs{gap:6px; margin:6px 0 2px; flex-wrap:wrap}
body.labl .labl-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:10px; margin-top:12px}
body.labl .btn.labl-tile{flex-direction:column; align-items:flex-start; gap:2px; min-height:116px; padding:14px; text-align:left; text-transform:none; letter-spacing:0}
body.labl .btn.labl-tile .ico{font-size:30px; line-height:1}
body.labl .btn.labl-tile b{font-family:var(--hd); font-weight:700; font-size:calc(22px*var(--tx)); text-transform:uppercase; letter-spacing:.03em}
body.labl .btn.labl-tile span:last-child{font-family:var(--px); font-size:calc(14px*var(--tx)); opacity:.85; font-weight:400}
body.labl .labl-stats{display:flex; gap:22px; flex-wrap:wrap; margin:6px 0 4px}
body.labl .labl-stats b{display:block; font-family:var(--hd); font-weight:700; font-size:calc(44px*var(--tx)); color:var(--gold); line-height:1}
body.labl .labl-stats span{font-family:var(--mono); font-size:calc(13px*var(--tx)); color:var(--bone-dim)}
body.labl .labl-form{display:grid; grid-template-columns:1fr 1fr auto auto; gap:8px; align-items:center}
@media (max-width:720px){ .labl-form{grid-template-columns:1fr 1fr} }
body.labl .labl-in{width:100%; font-size:calc(18px*var(--tx)); box-sizing:border-box}
body.labl .labl-lbl{display:block; margin:8px 0; font-family:var(--mono); font-weight:600; font-size:calc(13px*var(--tx)); color:var(--bone-dim); letter-spacing:.06em}
body.labl .labl-lbl>*{display:block; margin-top:4px; width:100%}
body.labl .labl-chk{display:flex; gap:10px; align-items:center; font-family:var(--px); font-size:calc(16px*var(--tx)); margin:6px 0}
body.labl .labl-chk input{width:22px; height:22px; accent-color:var(--orange)}
body.labl .labl-roster{display:flex; flex-direction:column; gap:4px}
body.labl .labl-row{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 10px; border-radius:8px; background:rgba(255,255,255,.05); font-size:calc(17px*var(--tx))}
body.labl .labl-row.off{opacity:.55}
body.labl .labl-row small{color:var(--bone-dim); font-family:var(--mono)}
body.labl .labl-log{font-family:var(--mono); font-size:calc(14px*var(--tx)); line-height:1.5; max-height:36vh; overflow:auto; border:1px solid rgba(255,255,255,.14); border-radius:8px; padding:8px}
body.labl .labl-modes{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:0 14px}
body.labl .labl-pin .pinbox{margin-top:6px}
body.labl .labl-switch .modegrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:8px 0 12px}
body.labl .labl-switch .btn.modepick{flex-direction:column; align-items:flex-start; gap:2px; min-height:74px; text-transform:none; letter-spacing:0; padding:10px 12px}
body.labl .labl-switch .btn.modepick b{font-family:var(--hd); font-size:calc(20px*var(--tx)); text-transform:uppercase}
body.labl .labl-switch .btn.modepick .modehelp{font-family:var(--px); font-size:calc(13px*var(--tx)); opacity:.9; font-weight:400}
body.labl .labl-switch .btn.modepick.on{background:#fff; color:var(--navy); border-color:#fff}
body.labl .labl-switch .btn.modepick.here{background:transparent; color:var(--bone-dim); border-color:rgba(255,255,255,.2)}
body.labl .bb-sync-off{display:none}
/* the arena bar's "ARENA · BULLET BALLET" eyebrow and tabs */
body.labl .arena-tabs .btn.small{border-radius:999px}
/* tables */
body.labl th{color:var(--orange) !important; font-family:var(--mono) !important; border-bottom:2px solid var(--orange) !important}
body.labl td{border-bottom:1px solid rgba(255,255,255,.1) !important}
body.labl .labl-hide{display:none !important}
body.labl .labl-table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:calc(17px*var(--tx))}
body.labl .labl-table th,body.labl .labl-table td{text-align:left;padding:6px 10px}
body.labl .labl-table td:first-child{font-family:var(--hd);color:var(--gold)}
/* Phase 0: panel footer + update banner (panel only) */
body.labl .labl-foot{text-align:center;font-family:var(--mono);font-size:calc(12px*var(--tx));color:var(--bone-dim);opacity:.8;padding:14px 0 6px}
body.labl .labl-update{display:block;width:100%;margin:8px 0;padding:12px 14px;min-height:52px;border:0;border-radius:10px;background:var(--orange);color:#fff;font-family:var(--hd);font-size:calc(18px*var(--tx));letter-spacing:.03em;text-transform:uppercase;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.35)}
body.labl .labl-update b{color:#fff;margin-right:6px}
/* Phase 1: teams, draw screen, chips, walk-in */
body.labl .labl-chip{display:inline-block;padding:6px 12px;min-height:40px;border-radius:999px;border:2px solid var(--edge);background:rgba(255,255,255,.06);color:var(--bone);font-family:var(--hd);font-size:calc(15px*var(--tx));letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;box-shadow:none}
body.labl .labl-chip.on{background:var(--orange);border-color:var(--orange);color:#fff}
body.labl .labl-chip.ghost{color:var(--bone-dim);border-style:dashed;text-transform:none;font-family:var(--px)}
body.labl .labl-chip.big{min-height:56px;font-size:calc(20px*var(--tx));padding:10px 18px;flex:1}
body.labl .labl-pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:6px}
body.labl .labl-prow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;min-height:56px;border-radius:10px;background:rgba(255,255,255,.05);border:2px solid transparent;cursor:pointer;font-size:calc(19px*var(--tx))}
body.labl .labl-prow.in{background:rgba(240,120,32,.18);border-color:var(--orange)}
body.labl .labl-prow .nm{font-family:var(--hd);text-transform:uppercase;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.labl .labl-prow small{color:var(--bone-dim);font-family:var(--px);text-transform:none;letter-spacing:0;font-size:calc(14px*var(--tx))}
body.labl .labl-teams2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
@media (max-width:640px){body.labl .labl-teams2{grid-template-columns:1fr}}
body.labl .labl-team{border:3px solid var(--tc);border-radius:12px;padding:10px;background:color-mix(in srgb,var(--tc) 16%,var(--navy2))}
body.labl .labl-team-h{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--hd);text-transform:uppercase;font-size:calc(26px*var(--tx));color:var(--tc);margin-bottom:6px}
body.labl .labl-team-h span{font-size:calc(34px*var(--tx));color:#fff}
body.labl .labl-team-names{display:flex;flex-wrap:wrap;gap:6px}
body.labl .labl-team-names .btn.small{min-height:44px;background:rgba(255,255,255,.08);border-color:transparent}
body.labl .labl-team-bal{margin-top:8px;font-family:var(--px);font-size:calc(14px*var(--tx));color:var(--bone-dim)}
body.labl .labl-runtools{gap:8px;margin:8px 0;flex-wrap:wrap}
body.labl .labl-walkin{font-size:calc(20px*var(--tx));flex:1;max-width:320px}
body.labl .labl-walk .labl-in{font-size:calc(24px*var(--tx));min-height:60px}
body.labl .labl-draw h1{font-size:calc(34px*var(--tx))}
/* Phase 2: rules card, opening talk, how-it-ended chips, stats grid, round editor */
body.labl .labl-rules-ov{align-items:flex-start;padding-top:2vh}
body.labl .labl-rules{max-width:1100px;width:96vw}
body.labl .labl-rules-mode{font-size:calc(56px*var(--tx));line-height:1;margin:4px 0 10px}
body.labl .labl-rules-text{font-family:var(--px);font-size:calc(30px*var(--tx));line-height:1.35;color:var(--bone);padding:12px 0;border-top:3px solid var(--orange);border-bottom:1px solid var(--edge)}
body.labl .labl-rules-facts{display:flex;gap:18px;margin:12px 0;flex-wrap:wrap}
body.labl .labl-rules-facts>div{display:flex;flex-direction:column;align-items:flex-start;min-width:120px}
body.labl .labl-rules-facts b{font-family:var(--hd);font-size:calc(44px*var(--tx));line-height:1;color:var(--gold)}
body.labl .labl-rules-facts span{font-family:var(--px);font-size:calc(14px*var(--tx));color:var(--bone-dim);text-transform:uppercase;letter-spacing:.06em}
body.labl .labl-rules-win{font-family:var(--hd);font-size:calc(24px*var(--tx));color:var(--orange);text-transform:uppercase}
body.labl .labl-rules-btn{margin:0 0 6px;font-size:calc(13px*var(--tx));min-height:34px}
body.labl .labl-talk{border:2px solid var(--orange);border-radius:10px;padding:10px 12px;margin:8px 0}
body.labl .labl-talk-text{font-family:var(--px);font-size:calc(22px*var(--tx));line-height:1.4;color:var(--bone)}
body.labl .labl-lbl2{font-family:var(--mono);font-size:calc(13px*var(--tx));color:var(--orange);letter-spacing:.08em;text-transform:uppercase;margin:10px 0 4px}
body.labl .labl-how{gap:6px;flex-wrap:wrap}
body.labl .labl-stat{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:4px}
body.labl .labl-stat-row{display:flex;align-items:center;gap:10px;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.05);min-height:52px}
body.labl .labl-stat-row .nm{flex:1;min-width:90px;font-family:var(--hd);text-transform:uppercase;font-size:calc(18px*var(--tx));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.labl .labl-stat-c{display:flex;align-items:center;gap:4px}
body.labl .labl-stat-c small{font-family:var(--px);color:var(--bone-dim);width:34px;text-align:right;font-size:calc(12px*var(--tx))}
body.labl .labl-stat-c .btn.small{min-width:44px;min-height:44px;font-size:calc(22px*var(--tx));padding:0}
body.labl .labl-stat-c b{font-family:var(--hd);font-size:calc(26px*var(--tx));min-width:30px;text-align:center;color:var(--gold)}
body.labl .labl-confirm{margin:8px 0}
body.labl .labl-edit{max-width:980px;width:96vw}
body.labl .labl-edit .labl-stat{grid-template-columns:repeat(auto-fill,minmax(400px,1fr))}
body.labl .labl-edit{max-height:92vh;overflow-y:auto}
/* Phase 3: plan row chips, props, packing list */
body.labl .labl-chip.mini{min-height:26px;padding:2px 10px;font-size:calc(12px*var(--tx));margin-left:4px;border-width:1px;vertical-align:middle}
body.labl .labl-rowchips{display:inline-flex;gap:2px;margin-left:8px;vertical-align:middle}
body.labl .labl-rowgear{display:block;font-family:var(--px);font-size:calc(12px*var(--tx));color:var(--bone-dim);text-transform:none;letter-spacing:0;margin-top:2px}
body.labl .labl-pack-row{font-size:calc(18px*var(--tx));margin:4px 0}
body.labl .labl-pack-row.done span{opacity:.55;text-decoration:line-through}
body.labl .labl-pack-row b{color:var(--gold);font-family:var(--hd)}
body.labl .labl-pack-row small{color:var(--bone-dim);font-size:calc(13px*var(--tx))}
/* Phase 4: the game screen in LABL colors (no CRT frame, no scanlines, no flicker) */
body.labl .screen{background:radial-gradient(ellipse at 50% 45%, #172b74 0%, #0f1f5c 60%, #0b1740 100%); border:3px solid var(--orange); box-shadow:0 0 0 3px #0b1740, 0 6px 24px rgba(0,0,0,.45); border-radius:12px; padding:10px}
body.labl .screen::after{display:none}
body.labl canvas.px{image-rendering:auto}
body.labl .hud .t{font-family:var(--hd); color:var(--gold)}
